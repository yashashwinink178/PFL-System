<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PFL System - Forward Bases</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1424;
            color: white;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #101c30;
            padding: 25px 15px;
            border-right: 1px solid #263650;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #65ff8a;
            margin-bottom: 35px;
            padding-left: 15px;
        }

        .menu {
            display: block;
            padding: 15px;
            margin: 8px 0;
            color: #d5dce8;
            text-decoration: none;
            border-radius: 10px;
        }

        .menu:hover,
        .menu.active {
            background: #263852;
            color: #65ff8a;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            color: #aeb9ca;
            margin-top: 8px;
        }

        .status {
            color: #65ff8a;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #17253b;
            border: 1px solid #2b3c58;
            padding: 22px;
            border-radius: 14px;
        }

        .summary-card h3 {
            color: #9facbf;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
        }

        .green {
            color: #65ff8a;
        }

        .yellow {
            color: #ffd52f;
        }

        .red {
            color: #ff6868;
        }

        /* BASE CARDS */

        .section {
            background: #121f34;
            border: 1px solid #293b57;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .base-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .base-card {
            background: #17253b;
            border: 1px solid #31435f;
            border-radius: 14px;
            padding: 22px;
            transition: 0.3s;
        }

        .base-card:hover {
            transform: translateY(-4px);
            border-color: #65ff8a;
        }

        .base-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .base-title h3 {
            font-size: 21px;
        }

        .location {
            color: #9facbf;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .info {
            margin: 12px 0;
            color: #c9d2df;
        }

        .info span {
            float: right;
            font-weight: bold;
        }

        /* PROGRESS */

        .bar-container {
            height: 8px;
            width: 100%;
            background: #263650;
            border-radius: 10px;
            margin-top: 7px;
            margin-bottom: 15px;
        }

        .bar {
            height: 100%;
            border-radius: 10px;
        }

        .fuel-alpha {
            width: 82%;
            background: #65ff8a;
        }

        .food-alpha {
            width: 76%;
            background: #65ff8a;
        }

        .medical-alpha {
            width: 61%;
            background: #ffd52f;
        }

        .fuel-bravo {
            width: 54%;
            background: #ffd52f;
        }

        .food-bravo {
            width: 71%;
            background: #65ff8a;
        }

        .medical-bravo {
            width: 48%;
            background: #ffd52f;
        }

        .fuel-charlie {
            width: 28%;
            background: #ff6868;
        }

        .food-charlie {
            width: 45%;
            background: #ffd52f;
        }

        .medical-charlie {
            width: 31%;
            background: #ff6868;
        }

        /* BADGES */

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .low {
            background: rgba(50, 220, 100, 0.15);
            color: #65ff8a;
        }

        .medium {
            background: rgba(255, 210, 40, 0.15);
            color: #ffd52f;
        }

        .high {
            background: rgba(255, 70, 70, 0.15);
            color: #ff6868;
        }

        /* BUTTON */

        .button {
            width: 100%;
            padding: 11px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #65ff8a;
            color: #07120b;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        /* TABLE */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #9facbf;
            padding: 14px;
            border-bottom: 1px solid #31415b;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #263650;
        }

        /* RESPONSIVE */

        @media(max-width: 1000px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .base-grid {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 650px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 20px;
            }
        }
        /* Muted military olive palette */
        body {
            background-color: #283025;
            background-image: linear-gradient(rgba(34, 42, 32, 0.46), rgba(34, 42, 32, 0.58)), url("military-background.svg");
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        .sidebar,
        .card,
        .section,
        .base,
        .risk-box {
            background-color: rgba(52, 60, 48, 0.88);
            border-color: #505a45;
        }

        .sidebar {
            background-color: #20271f;
            border-color: #414b3a;
        }

        .logo,
        .status,
        .menu:hover,
        .menu.active,
        .green {
            color: #bdca97;
        }

        .menu:hover,
        .menu.active {
            background-color: #414b37;
        }
    </style>
</head>
